<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Itinerary Chatbot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/styles.css" type="text/css">
</head>
<body>
    <div class="container vh-100 d-flex align-items-center justify-content-center">
        <div class="card p-4 shadow-lg" style="max-width: 500px; width: 100%;">
            <h2 class="text-center mb-3" id="step-title">Where are you planning to travel?</h2>
            <form id="travelForm">
                <div class="form-step" id="step-1">
                    <input type="text" class="form-control" id="destination" placeholder="Enter destination" required>
                </div>

                <div class="form-step d-none" id="step-2">
                    <label>Start Date</label>
                    <input type="date" class="form-control mb-2" id="startDate" required>
                    <label>End Date</label>
                    <input type="date" class="form-control" id="endDate" required>
                </div>

                <div class="form-step d-none" id="step-3">
                    <textarea class="form-control" id="travelers" placeholder="Who's coming with you?" required></textarea>
                </div>

                <div class="form-step d-none" id="step-4">
                    <textarea class="form-control" id="preferences" placeholder="Your preferences (e.g., beaches, nightlife)" required></textarea>
                </div>

                <div class="form-step d-none" id="step-5">
                    <input type="text" class="form-control" id="budget" placeholder="Your budget per person" required>
                </div>

                <div class="form-step d-none" id="step-6">
                    <p class="text-center">Review your details before submission:</p>
                    <pre id="jsonOutput" class="bg-light p-2 rounded"></pre>
                </div>

                <div class="d-flex justify-content-between mt-3">
                    <button type="button" class="btn btn-secondary" id="prevBtn" onclick="prevStep()" disabled>Back</button>
                    <button type="button" class="btn btn-primary" id="nextBtn" onclick="nextStep()">Next</button>
                    <button type="submit" class="btn btn-success d-none" id="submitBtn">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/script.js" type="text/javascript"></script>
</body>
</html>
